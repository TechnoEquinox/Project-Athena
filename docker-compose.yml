services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://athena_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      TOTP_REQUIRED_ROLES: ${TOTP_REQUIRED_ROLES:-admin,manager}
      PROXY_HOPS: "1"
      RETENTION_DAYS: ${retention_days:-30}
    ports:
      - "127.0.0.1:8000:8000"    # localhost only
  
  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host           # so ufw governs ports 80 and 443
    depends_on:
      - api
    environment:
      ATHENA_HOST: ${ATHENA_HOST:?set ATHENA_HOST in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data         # holds the CA's private key, so back it up
      - caddy_config:/config
  
  migrate:
    build: ./api
    profiles: ["tools"]          # not started by a normal `up`
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: wsgi:app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
    volumes:
      - ./api/migrations:/app/migrations   # so generated files land on the host
    command: ["flask", "db", "upgrade"]
  
  test:
    build:
      context: ./api
      args:
        INSTALL_DEV: "true"
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://athena_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/athena_test
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
    volumes:
      - ./api:/app:ro      # edit tests on the host, no rebuild needed
    command: ["pytest", "-v"]
    
volumes:
  pgdata:
  caddy_data:
  caddy_config: