services:
  db:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432" # localhost only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://athena_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000" # localhost only
  
  migrate:
    build: ./api
    profiles: ["tools"]          # not started by a normal `up`
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_APP: wsgi:app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./api/migrations:/app/migrations   # so generated files land on the host
    command: ["flask", "db", "upgrade"]
    
volumes:
  pgdata: